server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # Documentación agregada de OpenAPI por servicio
            - id: auth-openapi
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/openapi/auth
              filters:
                - SetPath=/v3/api-docs
            - id: academic-openapi
              uri: ${ACADEMIC_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/openapi/academic
              filters:
                - SetPath=/v3/api-docs
            - id: content-openapi
              uri: ${ACTIVITY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/openapi/content
              filters:
                - SetPath=/v3/api-docs
            - id: grading-openapi
              uri: ${GRADING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/openapi/grading
              filters:
                - SetPath=/v3/api-docs

            # 1. Autenticación, Usuarios y Cursos
            - id: auth-service
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**

            # 2. Asignaturas y Objetivos de Aprendizaje
            - id: academic-service
              uri: ${ACADEMIC_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/academic/**

            # Compatibility paths for the academic domain moved out of content.
            - id: academic-content-compatibility
              uri: ${ACADEMIC_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/content/cursos-portal,/api/v1/content/cursos-portal/**,/api/v1/content/catalogos/periodos-academicos,/api/v1/content/catalogos/periodos-academicos/**

            # 3. Actividades, Pruebas, Preguntas y Materiales
            - id: content-service
              uri: ${ACTIVITY_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/content/**  

            # 4. Respuestas, Corrección y Notas
            - id: grading-service
              uri: ${GRADING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/grading/**

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    urls-primary-name: ms-auth
    urls:
      - name: ms-auth
        url: /openapi/auth
      - name: ms-academic
        url: /openapi/academic
      - name: ms-content
        url: /openapi/content
      - name: ms-grading
        url: /openapi/grading

