spring.application.name=ms-auth
server.port=8081
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Base de datos MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/practika_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.liquibase.contexts=${SPRING_LIQUIBASE_CONTEXTS:dev}
# JWT
jwt.secret=${JWT_SECRET:practika-ms-auth-dev-secret-key-change-in-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.issuer=${JWT_ISSUER:practika-ms-auth}

# Optional initial administrator. Remove these environment variables after creation.
admin.inicial.run=${ADMIN_INICIAL_RUN:}
admin.inicial.nombre1=${ADMIN_INICIAL_NOMBRE1:}
admin.inicial.appaterno=${ADMIN_INICIAL_APPATERNO:}
admin.inicial.apmaterno=${ADMIN_INICIAL_APMATERNO:}
admin.inicial.email=${ADMIN_INICIAL_EMAIL:}
admin.inicial.password=${ADMIN_INICIAL_PASSWORD:}
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
